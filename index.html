<style>

function carSVG(body,hex,view='side',label=''){
  const [b,w,pil]=SH[body]||SH.Sedan,vb=view==='detail'?'230 90 170 100':'0 0 400 190';
  const wheel=x=>`<g class="wh" style="transform-origin:${x}px 144px"><circle cx="${x}" cy="144" r="36" fill="#0a0c10"/><circle cx="${x}" cy="144" r="30" fill="#1d2127"/><circle cx="${x}" cy="144" r="19" fill="#cfd5dd"/><circle cx="${x}" cy="144" r="19" fill="none" stroke="#7b8491" stroke-width="2"/>${[0,72,144,216,288].map(a=>`<line x1="${x}" y1="144" x2="${(x+17*Math.cos(a*Math.PI/180)).toFixed(1)}" y2="${(144+17*Math.sin(a*Math.PI/180)).toFixed(1)}" stroke="#7b8491" stroke-width="3"/>`).join('')}<circle cx="${x}" cy="144" r="5" fill="#4b5360"/></g>`;

}

const hasCar=()=>cart.some(l=>l.type==='car');

const TAX=CONFIG.taxRate,DELIV=CONFIG.deliveryFee;
function totals(delivery=true){const sub=cart.reduce((s,l)=>s+unit(l)*(l.qty||1),0),tax=sub*TAX,del=hasCar()&&delivery?DELIV:0;return{sub,tax,del,total:sub+tax+del}}
function deliveryDate(){const a=new Date(),b=new Date();a.setDate(a.getDate()+5);b.setDate(b.getDate()+9);const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});return f(a)+' - '+f(b)}
function monthly(price,down,term,apr=CONFIG.apr){const P=price-down,r=apr/1200;return P<=0?0:P*r/(1-Math.pow(1+r,-term))}

function card(c){
  const sale=c.was>c.price,on=wish.includes(c.id);
  return `<article class="card${c.sold?' sold':''}"><span class="tag${c.sold?' sold':''}">${c.sold?'Sold':'&#10003; Verified'}</span>
  <a class="img" href="#/car/${c.id}" aria-label="${esc(c.name)}">${c.photos&&c.photos[0]?`<img src="${c.photos[0]}" alt="${esc(c.name)}" loading="lazy">`:carSVG(c.body,COL[c.colors[0]][1],'side',c.name)}</a>
  <div class="body"><h3><a href="#/car/${c.id}">${c.year} ${esc(c.name)}</a></h3>
  <div class="price">${money(c.price)}${sale?`<s>${money(c.was)}</s>`:''}</div>
  <div class="specs"><span>${c.miles.toLocaleString()} km</span><span>${c.fuel}</span><span>${c.trans}</span></div>
  <div class="loc">${PIN}${esc(c.loc||CONFIG.city)}</div>
  <div class="cbtns"><a class="btn ghost view" href="#/car/${c.id}">View Details</a><button class="btn ghost savebtn" aria-pressed="${on}" aria-label="Save ${esc(c.name)}" data-wish="${c.id}">${on?'&#9829; Saved':'&#9825; Save'}</button></div></div></article>`;
}

    cart.filter(l=>l.type==='car').forEach(l=>{const c=carById(l.id);if(c)c.sold=true});persistCars();cart=[];save();checkout.st=null;location.hash='/confirm';scrollTo(0,0)};
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.getAttribute&&t.getAttribute('href')==='#reviews'){e.preventDefault();const el=$('#reviews');if(el)lenis?lenis.scrollTo(el,{offset:-80}):el.scrollIntoView({behavior:'smooth'});return}
  if(t.dataset.wish){e.preventDefault();toggleWish(t.dataset.wish);const on=wish.includes(t.dataset.wish);t.setAttribute('aria-pressed',on);t.innerHTML=t.classList.contains('savebtn')?(on?'&#9829; Saved':'&#9825; Save'):(on?'&#9829;':'&#9825;')}
  if(t.dataset.q!==undefined){const l=cart[+t.dataset.q];l.qty=Math.max(1,l.qty+ +t.dataset.d);save();renderCart()}
  if(t.dataset.rm!==undefined){cart.splice(+t.dataset.rm,1);save();renderCart()}
  if(t.dataset.addacc){const a=t.dataset.addacc,x=cart.find(l=>l.id===a);x?x.qty++:cart.push({type:'acc',id:a,qty:1});save();renderCart()}
  if(t.dataset.close!==undefined)closeCart();
  if(t.dataset.lead){e.preventDefault();const [k,id]=t.dataset.lead.split(':');leadModal(k,id)}
  if(t.id==='closeCart'||t.id==='scrim')closeCart();
  if(t.hasAttribute&&t.hasAttribute('data-faq')){e.preventDefault();toast('FAQ: 7-day returns, delivery in 5-9 days, 3-year warranty')}
});
$('#scrim').onclick=closeCart;$('#cartBtn').onclick=openCart;$('#wishBtn').onclick=()=>{location.hash='/saved'};
const _oldWish=()=>{if(!wish.length)return toast('No saved cars yet. Tap the heart on any car.');location.hash='/cars?q=';const ids=wish;$('#main').innerHTML=`<div class="wrap"><div class="crumbs"><a href="#/">Home</a> / Saved cars</div><h2 style="margin-top:12px">Saved cars (${ids.length})</h2><div class="grid">${ids.map(carById).filter(c=>c&&visible().includes(c)).map(card).join('')}</div></div>`;};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCart();$('#hdr').classList.remove('open')}});
try{history.scrollRestoration='manual'}catch(e){}
let lenis=null;
if(typeof Lenis!=='undefined'){lenis=new Lenis({lerp:.1});const raf=t=>{lenis.raf(t);requestAnimationFrame(raf)};requestAnimationFrame(raf)}
const toTop=()=>lenis?lenis.scrollTo(0,{immediate:true}):scrollTo(0,0);
let lastPath=(location.hash.slice(1)||'/').split('?')[0];
window.addEventListener('hashchange',()=>{
  const np=(location.hash.slice(1)||'/').split('?')[0];
  if((np==='/about'||np==='/contact')&&$('#about')){lastPath=np;scrollToId(np.slice(1));return}
  const changed=np!==lastPath;lastPath=np;
  if(!changed){route();return}
  const m=$('#main');m.classList.add('leaving');setTimeout(()=>{route();toTop();m.classList.remove('leaving')},170);
});
/* sticky header compaction + gentle image parallax */
let ticking=false;const onScroll=()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;$('#hdr').classList.toggle('scrolled',scrollY>40);
  $$('[data-parallax]').forEach(el=>{const r=el.parentElement.getBoundingClientRect();if(r.bottom<-100||r.top>innerHeight+100)return;el.style.transform=`translate3d(0,${((r.top+r.height/2-innerHeight/2)*-.09).toFixed(1)}px,0)`})})};
addEventListener('scroll',onScroll,{passive:true});onScroll();
/* search overlay */
const sov=$('#sov'),sq=$('#sq'),sres=$('#sres');
const openSearch=()=>{sov.classList.add('open');lenis&&lenis.stop();setTimeout(()=>sq.focus(),150)},closeSearch=()=>{sov.classList.remove('open');lenis&&lenis.start()};
$('#searchBtn').onclick=()=>sov.classList.contains('open')?closeSearch():openSearch();
sq.oninput=()=>{const v=sq.value.toLowerCase().trim();if(!v){sres.innerHTML='';return}const toks=v.split(/\s+/).map(t=>SYN[t]||t);const m=visible().filter(c=>{const h=(c.name+' '+c.make+' '+c.body+' '+c.fuel+' '+c.year).toLowerCase();return toks.every(t=>t==='deal'?c.was>c.price:h.includes(t.toLowerCase()))}).slice(0,6);
  sres.innerHTML=m.map(c=>`<a href="#/car/${c.id}">${c.year} ${esc(c.name)}<small>${money(c.price)}</small></a>`).join('')+`<a href="#/cars?q=${encodeURIComponent(sq.value.trim())}"><b>See all results for "${esc(sq.value.trim())}"</b></a>`};
sq.onkeydown=e=>{if(e.key==='Enter'&&sq.value.trim()){location.hash='/cars?q='+encodeURIComponent(sq.value.trim());closeSearch()}if(e.key==='Escape')closeSearch()};
sov.addEventListener('click',e=>{if(e.target.closest('a')||e.target===sov)closeSearch()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sov.classList.contains('open'))closeSearch()});
$('#burger').onclick=()=>{const o=$('#hdr').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(e.target.closest('#nav a, #nav button'))$('#hdr').classList.remove('open')});
$('#waBtn').href='https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent('Hi, I would like to know more about your cars.');
$('#logo').innerHTML=esc(CONFIG.name.toUpperCase()).replace(/\s+(.*)$/,'<em>$1</em>');
$('#foot').innerHTML=`<div class="cols"><div><span class="flogo">${$('#logo').innerHTML}</span>${esc(CONFIG.tagline)}.<br>Verified pre-owned cars, transparent pricing and professional assistance.<div class="soc">${Object.entries(CONFIG.social).map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${n}">${n.slice(0,2)}</a>`).join('')}</div></div>
<div><span class="footer-b">Quick links</span><a href="#/">Home</a><a href="#/cars">Inventory</a><a href="#/cars?premium=1">Premium Collection</a><a href="#/sell">Sell Your Car</a><a href="#/about">About</a><a href="#/contact">Contact</a></div>
<div><span class="footer-b">Inventory</span><a href="#/cars?body=SUV">SUV</a><a href="#/cars?body=Sedan">Sedan</a><a href="#/cars?body=Hatchback">Hatchback</a><a href="#/cars?luxury=1">Luxury</a><a href="#/cars?fuel=Electric">Electric</a><a href="#/cars?trans=Automatic">Automatic</a></div>
<div><span class="footer-b">Contact</span><a href="tel:${CONFIG.phone.replace(/\s/g,'')}">${esc(CONFIG.phone)}</a><a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a><a target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}">WhatsApp</a><span style="display:block;padding:4px 0">${esc(CONFIG.address)}</span><span style="display:block;padding:4px 0">${esc(CONFIG.hours)}</span></div></div>
<div class="fbot"><span>&copy; ${new Date().getFullYear()} ${esc(CONFIG.name)}. Prototype - listings are sample stock. Car photos: Wikimedia Commons contributors (CC BY / CC BY-SA), credited on each car page.</span><a href="#/admin">Dealer login</a></div>`;
try{if(!sessionStorage.getItem('apex.visit')){sessionStorage.setItem('apex.visit','1');track('visit')}}catch(e){}
save();route();
</script>
