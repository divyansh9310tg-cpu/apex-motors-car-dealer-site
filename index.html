/* ===== DEALER CONFIG: edit this block to white-label the site for a new dealer ===== */

const soldMode=()=>store.get('apex.soldMode',CONFIG.soldMode);
const visible=()=>CARS.filter(c=>!(c.sold&&soldMode()==='hide'));
function resizeImg(file,max=800){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.src=fr.result};fr.readAsDataURL(file)})}
const TRIMS=[['Standard',0,'']];
const ACC=[{id:'mats',name:'All-weather floor mats',price:189,ic:'&#128739;'},{id:'dash',name:'4K dash cam (front+rear)',price:249,ic:'&#128249;'},{id:'chg',name:'Home charger / wall unit',price:549,ic:'&#9889;'},{id:'ceram',name:'Ceramic paint protection',price:1290,ic:'&#10024;'},{id:'warr',name:'Extended warranty (+2 yrs)',price:1800,ic:'&#128737;'}];
const SYN={suv:'SUV',ev:'Electric',electric:'Electric',truck:'Truck',pickup:'Truck',sedan:'Sedan',hybrid:'Hybrid',sports:'Coupe',hatch:'Hatchback',diesel:'Diesel',family:'SUV',cheap:'deal'};
const CAPMAX=Math.max(20000,Math.ceil(Math.max(...CARS.map(c=>c.price))/10000)*10000);
const carById=id=>CARS.find(c=>c.id===id),accById=id=>ACC.find(a=>a.id===id);

/* ---------- car art (SVG) ---------- */
const SH={
Sedan:['M16 148 Q14 130 30 124 L74 116 Q100 112 126 100 Q152 78 182 70 Q204 64 234 64 Q264 64 284 82 L302 104 Q340 108 364 120 Q384 128 384 148 Q384 154 378 154 L22 154 Q16 154 16 148 Z','M142 102 Q160 82 184 76 L228 76 Q250 76 266 90 L282 104 Z',206],
SUV:['M14 150 Q12 126 28 118 L60 108 L92 100 Q104 66 128 58 L282 58 Q300 58 310 72 L328 100 Q356 104 370 114 Q386 124 386 150 Q386 156 380 156 L20 156 Q14 156 14 150 Z','M108 98 Q116 70 134 66 L284 66 Q294 66 300 76 L314 100 Z',200],
Hatchback:['M16 148 Q14 128 28 122 L66 112 Q92 106 112 92 Q132 66 164 62 L248 62 Q272 62 288 80 L304 104 Q342 108 366 120 Q384 128 384 148 Q384 154 378 154 L22 154 Q16 154 16 148 Z','M126 100 Q142 74 166 70 L246 70 Q262 70 274 84 L288 102 Z',202],
Coupe:['M14 148 Q12 132 28 126 L80 118 Q110 114 136 104 Q164 82 196 74 Q222 68 246 70 Q268 74 284 90 L298 108 Q342 112 368 122 Q386 130 386 148 Q386 154 380 154 L20 154 Q14 154 14 148 Z','M158 106 Q176 86 200 80 L240 78 Q258 80 270 92 L282 108 Z',0],
Truck:['M12 150 L12 100 Q12 94 18 94 L160 94 L160 74 Q160 62 174 60 L244 58 Q262 58 274 72 L292 98 Q336 100 362 112 Q386 122 386 150 Q386 156 380 156 L18 156 Q12 156 12 150 Z','M176 92 L176 70 Q176 66 182 66 L242 66 Q252 66 258 74 L274 92 Z',166]};
function carSVG(body,hex,view='side',label=''){
  const [b,w,pil]=SH[body]||SH.Sedan,vb=view==='detail'?'230 90 170 100':'0 0 400 190';
  const wheel=x=>`<circle cx="${x}" cy="144" r="36" fill="#0a0c10"/><circle cx="${x}" cy="144" r="30" fill="#1d2127"/><circle cx="${x}" cy="144" r="19" fill="#cfd5dd"/><circle cx="${x}" cy="144" r="19" fill="none" stroke="#7b8491" stroke-width="2"/>${[0,72,144,216,288].map(a=>`<line x1="${x}" y1="144" x2="${(x+17*Math.cos(a*Math.PI/180)).toFixed(1)}" y2="${(144+17*Math.sin(a*Math.PI/180)).toFixed(1)}" stroke="#7b8491" stroke-width="3"/>`).join('')}<circle cx="${x}" cy="144" r="5" fill="#4b5360"/>`;
  const flip=view==='mirror'?' transform="translate(400,0) scale(-1,1)"':'';
  return `<svg viewBox="${vb}" role="img" aria-label="${esc(label||body)}" xmlns="http://www.w3.org/2000/svg"><ellipse cx="200" cy="178" rx="176" ry="8" fill="#000" opacity=".22"/><g${flip}><path d="${b}" fill="${hex}"/><path d="${b}" fill="url(#shine)"/><path d="M26 146 L376 146 L376 152 Q376 154 372 154 L28 154 Q24 154 26 150 Z" fill="#0004"/><path d="${w}" fill="#a9bdd0" opacity=".92" stroke="#0005" stroke-width="1.2"/>${pil?`<path d="M${pil} ${body==='Truck'?66:76} L${pil} 148" stroke="#0003" stroke-width="2" fill="none"/><path d="M${pil} ${body==='Truck'?66:76} L${pil} ${body==='Truck'?92:104}" stroke="${hex}" stroke-width="7"/>`:''}<path d="M${pil?pil-70:140} 126 L${pil?pil+80:300} 126" stroke="#fff" stroke-opacity=".18" stroke-width="2" fill="none"/><rect x="${pil?pil-6:196}" y="118" width="12" height="3" rx="1.5" fill="#0006"/>${wheel(98)}${wheel(302)}<path d="M360 118 Q380 122 384 134 L372 130 Z" fill="#fff2b8"/><path d="M16 122 L28 124 L24 134 Q16 132 16 126 Z" fill="#ff4a4a"/></g></svg>`;
}
const stars=r=>'<span class="stars" aria-hidden="true">'+'&#9733;'.repeat(Math.round(r))+'&#9734;'.repeat(5-Math.round(r))+'</span>';

/* ---------- state ---------- */
let cart=store.get('apex.cart',[]),wish=store.get('apex.wish',[]),recent=store.get('apex.recent',[]);
const save=()=>{store.set('apex.cart',cart);store.set('apex.wish',wish);store.set('apex.recent',recent);$('#cartN').textContent=cart.reduce((n,l)=>n+(l.qty||1),0);$('#wishN').textContent=wish.length};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
const hasCar=()=>cart.some(l=>l.type==='car');
function unit(l){if(l.type==='acc')return accById(l.id).price;const c=carById(l.id);return c.price+TRIMS[l.trim||0][1]}
const TAX=CONFIG.taxRate,DELIV=CONFIG.deliveryFee;
function totals(delivery=true){const sub=cart.reduce((s,l)=>s+unit(l)*(l.qty||1),0),tax=sub*TAX,del=hasCar()&&delivery?DELIV:0;return{sub,tax,del,total:sub+tax+del}}
function deliveryDate(){const a=new Date(),b=new Date();a.setDate(a.getDate()+5);b.setDate(b.getDate()+9);const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});return f(a)+' - '+f(b)}
function monthly(price,down,term,apr=CONFIG.apr){const P=price-down,r=apr/1200;return P<=0?0:P*r/(1-Math.pow(1+r,-term))}

/* ---------- card ---------- */
function card(c){
  const sale=c.was>c.price,on=wish.includes(c.id);
  return `<article class="card${c.sold?' sold':''}"><span class="tag${sale||c.sold?' sale':''}">${c.sold?'Sold':sale?'-'+Math.round((1-c.price/c.was)*100)+'% off':esc(c.badge)}</span>
  <button class="heart" aria-pressed="${on}" aria-label="Save ${esc(c.name)}" data-wish="${c.id}">${on?'&#9829;':'&#9825;'}</button>
  <a class="img" href="#/car/${c.id}">${c.photos&&c.photos[0]?`<img src="${c.photos[0]}" alt="${esc(c.name)}" loading="lazy">`:carSVG(c.body,COL[c.colors[0]][1],'side',c.name)}</a>
  <div class="body"><h3><a href="#/car/${c.id}">${c.year} ${esc(c.name)}</a></h3>
  <div class="meta">${c.miles.toLocaleString()} mi &middot; ${c.fuel} &middot; ${c.trans} &middot; ${c.owners} owner${c.owners>1?'s':''}</div>
  <div>${stars(c.rating)} <small class="meta">${c.rating} (${c.reviews})</small></div>
  <div class="price">${money(c.price)}${sale?`<s>${money(c.was)}</s>`:''}</div>
  <div class="meta"><span class="dot" style="background:${COL[c.colors[0]][1]};display:inline-block;vertical-align:middle"></span> ${COL[c.colors[0]][0]} &middot; From ${money(monthly(c.price,c.price*.1,60))}/mo</div></div></article>`;
}

  <section class="blk"><div class="box" style="display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><h2 style="margin:0">Want to sell or trade in your car?</h2><p class="sub" style="margin:4px 0 0">Get a free valuation. We buy any make, any condition.</p></div><a class="btn" href="#/sell">Get my valuation</a></div></section>

function parseQ(){const h=location.hash.slice(1),i=h.indexOf('?');const p=new URLSearchParams(i<0?'':h.slice(i+1));return p}
function list(){
  const p=parseQ(),sel=k=>p.get(k)?p.get(k).split(','):[],body=sel('body'),fuel=sel('fuel'),trans=sel('trans'),q=(p.get('q')||'').toLowerCase().trim();
  const max=+p.get('max')||CAPMAX,sort=p.get('sort')||'featured',deals=p.get('deals')==='1',shown=+p.get('n')||9;
  let r=visible().filter(c=>(!body.length||body.includes(c.body))&&(!fuel.length||fuel.includes(c.fuel))&&(!trans.length||trans.includes(c.trans))&&c.price<=max&&(!deals||c.was>c.price));
  if(q){const toks=q.split(/\s+/).map(t=>SYN[t]||t);r=r.filter(c=>{const hay=(c.name+' '+c.make+' '+c.body+' '+c.fuel+' '+c.year+' '+c.trans).toLowerCase();return toks.every(t=>t==='deal'?c.was>c.price:hay.includes(t.toLowerCase()))})}
  const S={featured:(a,b)=>b.reviews-a.reviews,low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price,rating:(a,b)=>b.rating-a.rating,new:(a,b)=>b.year-a.year||a.miles-b.miles,miles:(a,b)=>a.miles-b.miles};
  r.sort((a,b)=>(a.sold-b.sold)||S[sort](a,b));
  const chk=(k,vals,cur)=>vals.map(v=>`<label><input type="checkbox" data-f="${k}" value="${v}" ${cur.includes(v)?'checked':''}> ${v} <small class="meta">(${CARS.filter(c=>c[k]===v).length})</small></label>`).join('');
  return `<div class="wrap"><div class="crumbs"><a href="#/">Home</a> / Cars${q?` / "${esc(q)}"`:''}</div><div class="layout">
  <aside class="filters" id="filters" aria-label="Filters"><h4>Body type</h4>${chk('body',['SUV','Sedan','Coupe','Hatchback','Truck'],body)}<h4>Fuel</h4>${chk('fuel',['Electric','Hybrid','Petrol','Diesel'],fuel)}<h4>Gearbox</h4>${chk('trans',['Automatic','Manual'],trans)}
  <h4>Max price: <span id="maxv">${money(max)}</span></h4><input type="range" id="max" min="10000" max="${CAPMAX}" step="1000" value="${max}" aria-label="Maximum price"><h4>Offers</h4><label><input type="checkbox" id="deals" ${deals?'checked':''}> Deals only</label><p><button class="link" id="clr">Clear all filters</button></p></aside>
  <div><div class="bar"><div><b>${r.length}</b> car${r.length===1?'':'s'} found <button class="btn ghost fbtn" id="fbtn" style="padding:8px 14px;margin-left:8px">Filters</button></div>
  <label>Sort <select id="sort" aria-label="Sort cars">${[['featured','Most popular'],['low','Price: low to high'],['high','Price: high to low'],['rating','Top rated'],['new','Newest'],['miles','Lowest mileage']].map(o=>`<option value="${o[0]}" ${sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label></div>
  ${r.length?`<div class="grid">${r.slice(0,shown).map(card).join('')}</div>${r.length>shown?`<p style="text-align:center;margin-top:22px"><button class="btn ghost" id="more">Load more (${r.length-shown} left)</button></p>`:''}`:`<div class="empty"><h3>No cars match those filters</h3><p>Try removing a filter or raising the maximum price.</p><button class="btn" id="clr2">Clear filters</button></div>`}</div></div></div>`;
}
function pdp(id){
  const c=carById(id);if(!c||!visible().includes(c))return `<div class="wrap empty"><h2>This car is no longer available</h2><p>It may have just been sold.</p><a class="btn" href="#/cars">Browse cars</a></div>`;
  const st=pdp.st=(pdp.st&&pdp.st.id===id)?pdp.st:{id,col:c.colors[0],trim:0,view:(c.photos&&c.photos.length)?'p0':'side',add:[],term:60,down:Math.round(c.price*.1)};
  const hex=COL[st.col][1],price=c.price+TRIMS[st.trim][1],addT=st.add.reduce((s,a)=>s+accById(a).price,0),sub=price+addT,tax=sub*TAX,sale=c.was>c.price,on=wish.includes(c.id);
  const reviews=[[5,'Smooth buying experience','Ordered on Sunday, delivered Thursday. Exactly as described, and the inspection report was spot on.','Thanks for the kind words! Enjoy the drive.'],[4,'Great car, small scuff','Drives beautifully. One tiny scuff on the rear bumper that was listed in the report.',''],[5,'Worth it','Used the 7-day window to be sure. Kept it. No regrets.','']];
  return `<div class="wrap"><div class="crumbs"><a href="#/">Home</a> / <a href="#/cars">Cars</a> / <a href="#/cars?body=${c.body}">${c.body}</a> / ${esc(c.name)}</div>
  <div class="pdp"><div class="gal"><div class="main">${st.view[0]==='p'&&c.photos[+st.view.slice(1)]?`<img src="${c.photos[+st.view.slice(1)]}" alt="${esc(c.name)}">`:carSVG(c.body,hex,st.view,c.name+' in '+COL[st.col][0])}</div>
   <div class="thumbs" role="group" aria-label="Gallery views">${(c.photos&&c.photos.length?c.photos.map((ph,i)=>`<button aria-pressed="${st.view==='p'+i}" data-view="p${i}" aria-label="Photo ${i+1}"><img src="${ph}" alt=""></button>`):[['side','Side'],['mirror','Other side'],['detail','Wheel detail']].map(v=>`<button aria-pressed="${st.view===v[0]}" data-view="${v[0]}" aria-label="${v[1]} view">${carSVG(c.body,hex,v[0],v[1])}</button>`)).join('')}</div>
   <p class="note">Illustrative render. ${c.photos&&c.photos.length?'':'The dealer can upload real photos in Admin.'}</p></div>
  <div class="buy"><span class="meta">Pre-owned &middot; ${c.year} &middot; ${c.miles.toLocaleString()} mi</span><h1>${esc(c.name)}</h1>
   <div>${stars(c.rating)} <a href="#reviews" class="meta">${c.rating} &middot; ${c.reviews} reviews</a></div>
   <div class="price" style="font-size:32px;margin-top:8px">${money(price)}${sale?`<s>${money(c.was+TRIMS[st.trim][1])}</s><em>Save ${money(c.was-c.price)}</em>`:''}</div>
   <div class="meta">or from <b>${money(monthly(price,st.down,st.term))}/mo</b> &middot; 6.9% APR est.</div>
   <div class="meta" style="margin-top:10px"><span class="dot" style="background:${hex};display:inline-block;vertical-align:middle"></span> ${COL[st.col][0]} &middot; ${c.trans} &middot; ${c.owners} previous owner${c.owners>1?'s':''}</div>
   ${c.sold?`<div class="box" style="margin:14px 0"><b>This car has been sold.</b><br><a href="#/cars">See similar cars</a> or <a href="#" data-lead="enquiry:${c.id}">ask us to find you one</a>.</div>`:''}
   <div class="box addons"><b>Add-ons</b>${ACC.map(a=>`<label><input type="checkbox" data-add="${a.id}" ${st.add.includes(a.id)?'checked':''}><span>${a.name}</span><b>${money(a.price)}</b></label>`).join('')}</div>
   <div class="box est" style="margin-top:12px"><div><span>Car + trim</span><span>${money(price)}</span></div>${addT?`<div><span>Add-ons</span><span>${money(addT)}</span></div>`:''}<div><span>Est. sales tax (${TAX*100}%)</span><span>${money(tax)}</span></div><div><span>Home delivery (pickup is free)</span><span>${money(DELIV)}</span></div><div class="tot"><span>Estimated total</span><span>${money(sub+tax+DELIV)}</span></div></div>
   <p class="deliv">&#128666; Get it between <b>${deliveryDate()}</b></p>
   <div class="ctas"><button class="btn" id="addcar" ${c.sold?'disabled':''}>Reserve online</button><button class="btn ghost" id="wishpdp" aria-pressed="${on}" aria-label="Save car">${on?'&#9829; Saved':'&#9825; Save'}</button></div>
   <div class="ctas"><button class="btn ghost" data-lead="drive:${c.id}">Book a test drive</button><a class="btn ghost" style="flex:1" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent('Hi, I am interested in the '+c.year+' '+c.name+' ('+money(c.price)+')')}">WhatsApp us</a><a class="btn ghost" href="tel:${CONFIG.phone.replace(/\s/g,'')}">Call</a></div>
   <p class="meta">Free ${CONFIG.returnDays}-day returns &middot; Refundable ${money(CONFIG.deposit)} deposit option &middot; Guest checkout, no account needed &middot; <a href="#" data-lead="enquiry:${c.id}">Ask a question</a></p>
   <div style="margin-top:14px"><details open><summary>Specifications</summary><table class="spec"><tr><td>Body</td><td>${c.body}</td></tr><tr><td>Fuel</td><td>${c.fuel}</td></tr><tr><td>${c.fuel==='Electric'?'Range':'Economy'}</td><td>${c.eff}</td></tr><tr><td>Power</td><td>${c.power}</td></tr><tr><td>Year</td><td>${c.year}</td></tr><tr><td>Mileage</td><td>${c.miles.toLocaleString()} mi</td></tr><tr><td>Gearbox</td><td>${c.trans}</td></tr><tr><td>Previous owners</td><td>${c.owners}</td></tr><tr><td>Colour</td><td>${COL[st.col][0]}</td></tr><tr><td>Warranty</td><td>${CONFIG.warranty}</td></tr></table></details>
   <details><summary>Delivery &amp; returns</summary><p>Home delivery in 5-9 days from ${money(DELIV)}, or collect free from our showroom: ${esc(CONFIG.address)}. Return within ${CONFIG.returnDays} days or 250 miles for a full refund, no questions asked.</p></details>
   <details><summary>Inspection &amp; history</summary><ul><li>200-point mechanical and cosmetic inspection</li><li>Ownership, accident and finance-check history report</li><li>Mileage verified, service records included</li><li>Cosmetic wear (if any) is listed and photographed</li></ul></details></div></div></div>
   <section class="blk fin" style="padding-top:0"><div class="box" style="max-width:560px"><b>Finance calculator</b><div class="row"><span>Down payment</span><b id="dv">${money(st.down)}</b></div><input type="range" id="down" min="0" max="${Math.round(price/2)}" step="500" value="${st.down}" aria-label="Down payment"><div class="row"><span>Term</span><b id="tv">${st.term} months</b></div><input type="range" id="term" min="36" max="84" step="12" value="${st.term}" aria-label="Loan term in months"><div class="big" id="mv">${money(monthly(price,st.down,st.term))}/mo</div><div class="note">Estimate at 6.9% APR. Final rate subject to approval; no impact to your credit score to check.</div></div></section>

   <section class="blk" style="padding-top:0"><h2>You may also like</h2><div class="grid">${CARS.filter(x=>x.id!==id&&!x.sold&&(x.body===c.body||x.fuel===c.fuel)).slice(0,3).map(card).join('')}</div></section>
   ${recent.filter(x=>x!==id).length?`<section class="blk" style="padding-top:0"><h2>Recently viewed</h2><div class="grid">${recent.filter(x=>x!==id&&carById(x)&&visible().includes(carById(x))).slice(0,3).map(carById).map(card).join('')}</div></section>`:''}</div>
   <div class="stickybuy"><div><b>${money(price)}</b><div class="meta">${money(monthly(price,st.down,st.term))}/mo</div></div><button class="btn" id="addcar2" ${c.sold?'disabled':''}>Reserve online</button></div>`;
}

function leadFields(phoneReq){return `<div class="two"><div class="f"><label for="ln1">Your name</label><input id="ln1" autocomplete="name"><div class="err" id="e-ln1"></div></div><div class="f"><label for="lp">Phone ${phoneReq?'':'<i>(optional)</i>'}</label><input id="lp" type="tel" autocomplete="tel"><small>So we can call you back.</small><div class="err" id="e-lp"></div></div></div><div class="f"><label for="le">Email <i>(optional)</i></label><input id="le" type="email" autocomplete="email"><div class="err" id="e-le"></div></div>`}
function readLead(root=document){const g=i=>$('#'+i,root).value.trim();let ok=true;const bad=(i,m)=>{$('#e-'+i,root).textContent=m;$('#'+i,root).setAttribute('aria-invalid','true');ok=false};
  $$('.err',root).forEach(x=>x.textContent='');$$('[aria-invalid]',root).forEach(x=>x.removeAttribute('aria-invalid'));
  if(!g('ln1'))bad('ln1','Enter your name.');if(g('lp').replace(/\D/g,'').length<7)bad('lp','Enter a phone number we can call (at least 7 digits).');if(g('le')&&!/^\S+@\S+\.\S+$/.test(g('le')))bad('le','That email looks incomplete.');
  return ok?{name:g('ln1'),phone:g('lp'),email:g('le')}:null}
function addLead(l){const L=store.get('apex.leads',[]);L.unshift({...l,at:new Date().toISOString(),id:Date.now()});store.set('apex.leads',L)}

  document.body.appendChild(m);const close=()=>m.remove();m.querySelector('.scrim').onclick=close;m.querySelector('[data-x]').onclick=close;$('#ln1',m).focus();

function bindAdmin(){
  const pf=$('#pinForm');if(pf){pf.onsubmit=e=>{e.preventDefault();if($('#pin').value===CONFIG.adminPin){adminPage.ok=true;route()}else $('#e-pin').textContent='Incorrect PIN.'};return}
  let pics=[];$('#aph').onchange=async e=>{try{pics=await Promise.all([...e.target.files].slice(0,4).map(f=>resizeImg(f)));$('#aprev').innerHTML=pics.map(x=>`<img src="${x}" alt="" style="max-width:90px">`).join('')}catch(x){$('#e-add').textContent='Could not read one of the images.'}};
  $('#addForm').onsubmit=e=>{e.preventDefault();const v=i=>$('#'+i).value.trim(),n=i=>+v(i).replace(/[^\d.]/g,'');
    if(!v('an')||!v('am')||!n('ay')||!n('ap')||v('ak')==='')return $('#e-add').textContent='Name, make, year, mileage and price are required.';
    if(n('ay')<1990||n('ay')>new Date().getFullYear()+1)return $('#e-add').textContent='Enter a valid year.';
    const car=toCar(['c'+Date.now(),v('an'),v('am'),v('ab'),v('af'),n('ay'),'Used',n('ap'),n('aw'),n('ak'),v('ae')||'-','-',4.5,0,'New Arrival',v('acol'),n('ao')||1,v('at')]);car.photos=pics;CARS.unshift(car);
    if(!persistCars()){CARS.shift();return $('#e-add').textContent='Browser storage is full. Use fewer or smaller photos, or delete old cars.'}
    route();toast('Car added')};
  $('#smode').onchange=e=>{store.set('apex.soldMode',e.target.value);toast(e.target.value==='hide'?'Sold cars will be removed from the site':'Sold cars will show a Sold badge')};
  $$('[data-price]').forEach(i=>i.onchange=()=>{const c=carById(i.dataset.price),v=+i.value;if(v>0){if(v<c.price)c.was=c.was>v?c.was:c.price;c.price=v;persistCars();toast('Price updated')}});
  $$('[data-ph]').forEach(i=>i.onchange=async()=>{const c=carById(i.dataset.ph),old=c.photos;try{c.photos=await Promise.all([...i.files].slice(0,4).map(f=>resizeImg(f)));if(!persistCars()){c.photos=old;return toast('Storage full. Use fewer or smaller photos.')}route();toast('Photos saved')}catch(x){c.photos=old;toast('Could not read the image')}});
  $$('[data-sold]').forEach(b=>b.onclick=()=>{const c=carById(b.dataset.sold);c.sold=!c.sold;persistCars();route();toast(c.sold?'Marked sold':'Back on sale')});
  $$('[data-del]').forEach(b=>b.onclick=()=>{CARS=CARS.filter(c=>c.id!==b.dataset.del);persistCars();route()});
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(CARS,null,2)],{type:'application/json'}));a.download='stock.json';a.click()};
  $('#rst').onclick=()=>{CARS=SEED.map(toCar);persistCars();route()};}

/* ---------- router ---------- */
function route(){
  const h=location.hash.slice(1)||'/',path=h.split('?')[0],m=$('#main');
  document.body.classList.toggle('pdp-page',path.startsWith('/car/'));
  let html;
  if(path==='/')html=home();else if(path==='/cars')html=list();else if(path.startsWith('/car/')){const id=path.split('/')[2];html=pdp(id);if(carById(id)){recent=[id,...recent.filter(x=>x!==id)].slice(0,6);save()}}
  else if(path==='/sell')html=sellPage();else if(path==='/admin')html=adminPage();else if(path==='/checkout')html=checkout();else if(path==='/confirm')html=confirm();else html=home();
  m.innerHTML=html;document.title=(path.startsWith('/car/')&&carById(path.split('/')[2])?carById(path.split('/')[2]).name+' - ':'')+'Apex Motors';
  bind(path);
}
function setQ(mut){const p=parseQ();mut(p);const s=p.toString();location.hash='/cars'+(s?'?'+s:'')}
function bind(path){
  if(path==='/cars'){
    $$('[data-f]').forEach(i=>i.onchange=()=>setQ(p=>{const k=i.dataset.f,cur=(p.get(k)||'').split(',').filter(Boolean),n=i.checked?[...cur,i.value]:cur.filter(v=>v!==i.value);n.length?p.set(k,n.join(',')):p.delete(k);p.delete('n')}));
    const mx=$('#max');mx.oninput=()=>$('#maxv').textContent=money(mx.value);mx.onchange=()=>setQ(p=>{+mx.value>=CAPMAX?p.delete('max'):p.set('max',mx.value)});
    $('#deals').onchange=e=>setQ(p=>e.target.checked?p.set('deals','1'):p.delete('deals'));
    $('#sort').onchange=e=>setQ(p=>p.set('sort',e.target.value));
    const clr=()=>{const q=parseQ().get('q');location.hash='/cars'+(q?'?q='+encodeURIComponent(q):'')};$('#clr').onclick=clr;$('#clr2')&&($('#clr2').onclick=clr);
    $('#more')&&($('#more').onclick=()=>setQ(p=>p.set('n',(+p.get('n')||9)+9)));
    $('#fbtn').onclick=()=>$('#filters').classList.toggle('open');
  }
  if(path.startsWith('/car/')&&pdp.st){
    const st=pdp.st,rerender=()=>{const y=scrollY;$('#main').innerHTML=pdp(st.id);bind(path);scrollTo(0,y)};
    $$('[data-view]').forEach(b=>b.onclick=()=>{st.view=b.dataset.view;rerender()});$$('[data-col]').forEach(b=>b.onclick=()=>{st.col=b.dataset.col;rerender()});$$('[data-trim]').forEach(b=>b.onclick=()=>{st.trim=+b.dataset.trim;rerender()});
    $$('[data-add]').forEach(i=>i.onchange=()=>{st.add=i.checked?[...st.add,i.dataset.add]:st.add.filter(a=>a!==i.dataset.add);rerender()});
    const c=carById(st.id),upd=()=>{const pr=c.price+TRIMS[st.trim][1];$('#dv').textContent=money(st.down);$('#tv').textContent=st.term+' months';$('#mv').textContent=money(monthly(pr,st.down,st.term))+'/mo'};
    $('#down').oninput=e=>{st.down=+e.target.value;upd()};$('#term').oninput=e=>{st.term=+e.target.value;upd()};
    const add=()=>{if(c.sold)return;if(cart.some(l=>l.type==='car'&&l.id===st.id))return openCart();cart=cart.filter(l=>l.type!=='car'||l.id!==st.id);cart.push({type:'car',id:st.id,col:st.col,trim:st.trim});st.add.forEach(a=>{const e=cart.find(l=>l.id===a);e?e.qty++:cart.push({type:'acc',id:a,qty:1})});save();toast('Added to cart');openCart()};
    $('#addcar').onclick=add;$('#addcar2').onclick=add;$('#wishpdp').onclick=()=>{toggleWish(st.id);rerender()};
  }
  if(path==='/checkout'&&cart.length)bindCheckout();
  if(path==='/admin')bindAdmin();
  if(path==='/sell'){const f=$('#sellForm'),rq=(id,m,t)=>{if(!t){$('#e-'+id).textContent=m;$('#'+id).setAttribute('aria-invalid','true');return false}return true};
    f.onsubmit=e=>{e.preventDefault();const l=readLead();const y=+$('#sy').value,k=$('#sk').value.replace(/\D/g,'');let ok=!!l;ok=rq('sm','Enter the make and model.',$('#sm').value.trim())&&ok;ok=rq('sy','Enter a 4-digit year, e.g. 2018.',y>=1980&&y<=new Date().getFullYear()+1)&&ok;ok=rq('sk','Enter the mileage as a number.',k)&&ok;if(!ok)return;addLead({...l,type:'Sell / trade-in',car:$('#sy').value+' '+$('#sm').value.trim(),note:k+' mi, '+$('#sc').value});f.reset();toast('Request sent. We will call you with an offer.')}}
}
function toggleWish(id){wish=wish.includes(id)?wish.filter(x=>x!==id):[...wish,id];save();toast(wish.includes(id)?'Saved. No login needed.':'Removed from saved')}
function bindCheckout(){
  const co=checkout.st,f=$('#coForm');
  f.addEventListener('change',e=>{if(['ship','pay','dep'].includes(e.target.name)){co[e.target.name]=e.target.value;const v={};$$('input[type=text],input[type=email],input[type=tel],input:not([type])',f).forEach(i=>v[i.id]=i.value);$('#main').innerHTML=checkout();$$('input',$('#main')).forEach(i=>{if(v[i.id]!==undefined)i.value=v[i.id]});bindCheckout()}});
  $('#cn').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();
  $('#ex').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=v.length>2?v.slice(0,2)+'/'+v.slice(2):v};
  f.onsubmit=e=>{e.preventDefault();
    const rules=[['em',v=>!v?'Enter your email so we can send your receipt.':!/^\S+@\S+\.\S+$/.test(v)?'That email looks incomplete. Use a format like name@example.com.':''],['fn',v=>v.trim()?'':'Enter your first name.'],['ln',v=>v.trim()?'':'Enter your last name.']];
    if(co.ship==='home')rules.push(['ad',v=>v.trim().length<5?'Enter the street address for delivery.':''],['ct',v=>v.trim()?'':'Enter the delivery city.'],['zp',v=>/^\d{5}$/.test(v)?'':'ZIP code must be exactly 5 digits.']);
    if(co.pay==='card')rules.push(['cn',v=>v.replace(/\s/g,'').length!==16?'Card number must be 16 digits (you entered '+v.replace(/\s/g,'').length+').':''],['ex',v=>{const m=v.match(/^(\d\d)\/(\d\d)$/);if(!m||+m[1]<1||+m[1]>12)return 'Enter expiry as MM/YY, for example 08/28.';return (+('20'+m[2])*12+ +m[1])<(new Date().getFullYear()*12+new Date().getMonth()+1)?'This card has expired. Use a card that is still valid.':''}],['cv',v=>/^\d{3,4}$/.test(v)?'':'CVC is the 3 or 4 digits on your card.']);
    let first=null;$$('.err',f).forEach(x=>x.textContent='');$$('input',f).forEach(i=>i.removeAttribute('aria-invalid'));
    rules.forEach(([id,fn])=>{const el=$('#'+id),msg=fn(el.value);if(msg){$('#e-'+id).textContent=msg;el.setAttribute('aria-invalid','true');first=first||el}});
    if(first){first.focus();return}
    const T=totals(co.ship==='home'),due=co.dep==='dep'&&hasCar()?CONFIG.deposit:T.total;
    store.set('apex.order',{no:'AX-'+Math.random().toString(36).slice(2,8).toUpperCase(),name:$('#fn').value.trim(),email:$('#em').value.trim(),ship:co.ship,date:deliveryDate(),total:T.total,due});
    cart.filter(l=>l.type==='car').forEach(l=>{const c=carById(l.id);if(c)c.sold=true});persistCars();cart=[];save();checkout.st=null;location.hash='/confirm';scrollTo(0,0)};
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.wish){e.preventDefault();toggleWish(t.dataset.wish);const on=wish.includes(t.dataset.wish);t.setAttribute('aria-pressed',on);t.innerHTML=on?'&#9829;':'&#9825;'}
  if(t.dataset.q!==undefined){const l=cart[+t.dataset.q];l.qty=Math.max(1,l.qty+ +t.dataset.d);save();renderCart()}
  if(t.dataset.rm!==undefined){cart.splice(+t.dataset.rm,1);save();renderCart()}
  if(t.dataset.addacc){const a=t.dataset.addacc,x=cart.find(l=>l.id===a);x?x.qty++:cart.push({type:'acc',id:a,qty:1});save();renderCart()}
  if(t.dataset.close!==undefined)closeCart();
  if(t.dataset.lead){e.preventDefault();const [k,id]=t.dataset.lead.split(':');leadModal(k,id)}
  if(t.id==='closeCart'||t.id==='scrim')closeCart();
  if(t.hasAttribute&&t.hasAttribute('data-faq')){e.preventDefault();toast('FAQ: 7-day returns, delivery in 5-9 days, 3-year warranty')}
});
$('#scrim').onclick=closeCart;$('#cartBtn').onclick=openCart;$('#wishBtn').onclick=()=>{if(!wish.length)return toast('No saved cars yet. Tap the heart on any car.');location.hash='/cars?q=';const ids=wish;$('#main').innerHTML=`<div class="wrap"><div class="crumbs"><a href="#/">Home</a> / Saved cars</div><h2 style="margin-top:12px">Saved cars (${ids.length})</h2><div class="grid">${ids.map(carById).filter(c=>c&&visible().includes(c)).map(card).join('')}</div></div>`;};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCart();$('#ac').style.display='none'}});
/* search autocomplete */
const q=$('#q'),ac=$('#ac');let acI=-1;
function matches(v){v=v.toLowerCase().trim();if(!v)return[];const toks=v.split(/\s+/).map(t=>SYN[t]||t);return visible().filter(c=>{const h=(c.name+' '+c.make+' '+c.body+' '+c.fuel+' '+c.year).toLowerCase();return toks.every(t=>t==='deal'?c.was>c.price:h.includes(t.toLowerCase()))}).slice(0,6)}
q.oninput=()=>{const m=matches(q.value);acI=-1;if(!q.value.trim()){ac.style.display='none';return}
  ac.innerHTML=m.length?m.map((c,i)=>`<a href="#/car/${c.id}" role="option" id="ao${i}">${carSVG(c.body,COL[c.colors[0]][1],'side')}<span><b>${c.year} ${esc(c.name)}</b><br><small>${c.cond} &middot; ${c.fuel} &middot; ${money(c.price)}</small></span></a>`).join('')+`<a href="#/cars?q=${encodeURIComponent(q.value)}"><b>See all results for "${esc(q.value)}"</b></a>`:`<a href="#/cars?q=${encodeURIComponent(q.value)}">No instant match. Search all for "${esc(q.value)}"</a>`;ac.style.display='block'};
q.onkeydown=e=>{const o=$$('a',ac);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();acI=(acI+(e.key==='ArrowDown'?1:-1)+o.length)%o.length;o.forEach((a,i)=>a.setAttribute('aria-selected',i===acI))}
  else if(e.key==='Enter'){e.preventDefault();ac.style.display='none';if(acI>=0&&o[acI])location.hash=o[acI].getAttribute('href').slice(1);else location.hash='/cars?q='+encodeURIComponent(q.value)}};
document.addEventListener('click',e=>{if(!e.target.closest('.search'))ac.style.display='none';else if(e.target.closest('.ac a'))setTimeout(()=>{ac.style.display='none';q.value=''},0)});
window.addEventListener('hashchange',()=>{route();scrollTo(0,0)});
$('#logo').innerHTML=esc(CONFIG.name.toUpperCase()).replace(/\s+/,'<b>.</b>');
$('#topbar').textContent='Free '+CONFIG.returnDays+'-day returns \u00b7 '+CONFIG.warranty+' \u00b7 200-point inspection';
$('#foot').innerHTML=`<div><b>${esc(CONFIG.name)}</b>${esc(CONFIG.tagline)}<br>${esc(CONFIG.address)}<br>${esc(CONFIG.hours)}</div><div><b>Contact</b><a href="tel:${CONFIG.phone.replace(/\s/g,'')}">${esc(CONFIG.phone)}</a><a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a><a target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}">WhatsApp</a></div><div><b>Buy</b><a href="#/cars">Browse all</a><a href="#/cars?deals=1">Deals</a><a href="#/sell">Sell your car</a></div><div><b>Trust</b>${CONFIG.returnDays}-day returns<br>${esc(CONFIG.warranty)}<br>Secure checkout<br><a href="#/admin">Dealer login</a></div>`;
save();route();
</script>
